{% extends "tasks/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 mt-3">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">{% if object %}Update Task{% else %}Create New Task{% endif %}</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <hr>
                    <button type="submit" class="btn btn-success px-4">Save Task</button>
                    <a href="{% url 'task-list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
