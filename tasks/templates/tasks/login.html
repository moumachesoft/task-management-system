{% extends "tasks/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow mt-5 border-0">
            <div class="card-body p-5">
                <h3 class="text-center mb-4">Login to Task Manager</h3>
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-2 fs-5">Login</button>
                </form>
                <div class="text-center mt-4">
                    <span>Don't have an account? </span><a href="{% url 'register' %}" class="text-decoration-none">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
