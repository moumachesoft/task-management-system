<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Django default form inputs ke style korar jonno */
        input[type="text"], input[type="password"], input[type="email"], select, textarea, input[type="date"] {
            display: block;
            width: 100%;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
        }
        label { font-weight: bold; margin-bottom: 5px; }
        .helptext { font-size: 0.8rem; color: gray; }
    </style>
</head>
<body class="bg-light">
    <!-- Modern Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{% url 'task-list' %}">Task Manager</a>
            <div class="d-flex">
                {% if user.is_authenticated %}
                    <a href="{% url 'task-list' %}" class="btn btn-outline-light me-2">My Tasks</a>
                    <a href="{% url 'task-create' %}" class="btn btn-success me-2">+ New Task</a>
                    <form action="{% url 'logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Logout ({{ user.username }})</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light me-2">Login</a>
                    <a href="{% url 'register' %}" class="btn btn-primary">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
